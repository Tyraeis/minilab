apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-secret
    key: root-password
  storage:
    storageClassName: longhorn-strict-local
    size: 1Gi
  replicas: 3
  galera:
    enabled: true
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  updateStrategy:
    autoUpdateDataPlane: true
  affinity:
    antiAffinityEnabled: true
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                  - mariadb
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mariadb

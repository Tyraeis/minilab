apiVersion: v1alpha1
kind: KubeAdmissionControlConfig
name: PodSecurity
configuration:
  apiVersion: pod-security.admission.config.k8s.io/v1alpha1
  defaults:
    audit: restricted
    audit-version: latest
    enforce: baseline
    enforce-version: latest
    warn: restricted
    warn-version: latest
  exemptions:
    namespaces:
    - metallb
    - longhorn
    - prometheus
    - loki
    - node-feature-discovery
    - concourse
    - crowdsec
    runtimeClasses: []
    usernames: []
  kind: PodSecurityConfiguration
